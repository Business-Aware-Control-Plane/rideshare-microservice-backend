apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: rideshare
data:
  ENVIRONMENT: "development"
  JAEGER_ENDPOINT: "http://jaeger:4318/v1/traces"
  GATEWAY_HTTP_ADDR: ":8081"
  STRIPE_SUCCESS_URL: "http://web.rideshare:8080/?payment=success"
  STRIPE_CANCEL_URL: "http://web.rideshare:8080/?payment=cancel"
  REDIS_ADDR: "redis:6379"
